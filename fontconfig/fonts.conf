<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ==========================================
  Fontconfig: Iosevka Nerd Font everywhere
  ==========================================
  Makes Iosevka Nerd Font the preferred font for the generic families, so every
  app (and every web page in Thorium) that asks for sans-serif, serif or
  monospace gets Iosevka. Web pages that ship their own web fonts keep those.
  Noto Color Emoji stays available as fallback for emoji.
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Iosevka Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Iosevka Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Iosevka Nerd Font Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Common system fonts that web pages request by name (without shipping them) -->
  <match target="pattern"><test name="family"><string>Arial</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>Helvetica</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>Helvetica Neue</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>Verdana</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>Tahoma</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>Segoe UI</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>Roboto</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>Open Sans</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>Liberation Sans</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>DejaVu Sans</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>Times New Roman</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>Georgia</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>Liberation Serif</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>DejaVu Serif</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font</string></edit></match>
  <match target="pattern"><test name="family"><string>Courier</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font Mono</string></edit></match>
  <match target="pattern"><test name="family"><string>Courier New</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font Mono</string></edit></match>
  <match target="pattern"><test name="family"><string>Consolas</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font Mono</string></edit></match>
  <match target="pattern"><test name="family"><string>Menlo</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font Mono</string></edit></match>
  <match target="pattern"><test name="family"><string>Monaco</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font Mono</string></edit></match>
  <match target="pattern"><test name="family"><string>Liberation Mono</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font Mono</string></edit></match>
  <match target="pattern"><test name="family"><string>DejaVu Sans Mono</string></test><edit name="family" mode="assign" binding="strong"><string>Iosevka Nerd Font Mono</string></edit></match>
</fontconfig>
