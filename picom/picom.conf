# --- Shadows ---
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.50;
shadow-offset-x = -12;
shadow-offset-y = -12;

# Exclude Polybar from shadows
shadow-exclude = [
    "class_g = 'Polybar'"
];

# --- Opacity ---
inactive-opacity = 0.97;
active-opacity = 1.0;
frame-opacity = 1.0;

# Keep Rofi and Polybar at 100% opacity, Kitty & Thunar at 92%, Thorium at 97%
opacity-rule = [
    "100:class_g = 'Rofi'",
    "100:class_g = 'Polybar'",
    "92:class_g = 'kitty'",
    "92:class_g = 'Kitty'",
    "92:class_g = 'Thunar'",
    "92:class_g = 'thunar'",
    "97:class_g = 'thorium'",
    "97:class_g = 'Thorium'",
    "97:class_g = 'Thorium-browser'",
    "97:class_g = 'thorium-browser'"
];

# --- Rounded Corners ---
corner-radius = 4;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'"
];

# --- Performance ---
# Default/fallback backend. scripts/picom-launch.sh (started by i3) overrides it:
# glx on bare metal (GPU), xrender inside a VM.
backend = "xrender";
vsync = true;
