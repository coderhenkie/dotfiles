# ==========================================
# Kitty Terminal Configuration
# ==========================================

# Font
# font_family: set by the active font module in ~/.cache/theme/kitty.conf ($mod+Shift+f)
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window & Layout
window_padding_width 10
confirm_os_window_close 0
enable_audio_bell no

# Cursor & Tabbar
cursor_shape beam
tab_bar_style powerline
tab_powerline_style slanted

# Load the dynamic color scheme from the Color Engine
include ~/.cache/theme/kitty.conf
