[bar/main]
width = 100%
height = 24
background = #1a1b26
foreground = #c0caf5
padding-right = 2
module-margin = 1

# Gebruik ons zojuist geïnstalleerde Nerd Font
font-0 = "JetBrainsMono Nerd Font:size=10;2"

modules-left = i3
modules-center = date
modules-right = cpu memory pulseaudio tray

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
format = <label-state> <label-mode>
label-focused = %index%
label-focused-foreground = #ffffff
label-focused-background = #3b4252
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-padding = 2

[module/date]
type = internal/date
interval = 5
date = "%d-%m-%Y"
time = "%H:%M"
label =  %time%   %date%

[module/tray]
type = internal/tray
