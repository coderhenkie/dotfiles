# ==========================================
# Rofi App Icons: icon name -> Nerd Font glyph
# ==========================================
# scripts/rofi-icons.sh renders these glyphs (Material Design Icons inside Iosevka
# Nerd Font) in the Color Engine accent into ~/.local/share/icons/ColorEngine-Apps,
# the icon theme Rofi uses. Look up glyph codes at https://www.nerdfonts.com/cheat-sheet
#
# Format: <Icon= value from the app's .desktop file>  <hex codepoint>  # <glyph name>
# Apps not listed here get a glyph based on their Categories (see [categories]).

[icons]
thorium                     f059f   # md-web
firefox-esr                 f0239   # md-firefox
obsidian                    f01c8   # md-diamond_stone
spotify-client              f04c7   # md-spotify
spotify                     f04c7   # md-spotify
kitty                       f018d   # md-console
mini.xterm                  f07b7   # md-console_line
org.xfce.thunar             f024b   # md-folder
thunar                      f024b   # md-folder
org.xfce.volman             f0553   # md-usb
xarchiver                   f003c   # md-archive
org.pwmt.zathura            f0226   # md-file_pdf_box
mpv                         f040c   # md-play_circle
imv                         f02e9   # md-image
display-im7.q16             f03d8   # md-palette
btop                        f0a07   # md-monitor_dashboard
multimedia-volume-control   f057e   # md-volume_high
preferences-system-network  f0317   # md-lan
display                     f037a   # md-monitor_multiple
arandr                      f037a   # md-monitor_multiple
timeshift                   f006f   # md-backup_restore
picom                       f0328   # md-layers
rofi                        f0349   # md-magnify
gvim                        e62b    # custom-vim
nvim                        e62b    # custom-vim
yad                         f0831   # md-shape
blueman                     f00af   # md-bluetooth
blueman-manager             f00af   # md-bluetooth

