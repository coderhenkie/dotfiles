<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ==========================================
  Fontconfig: active Color Engine font everywhere
  ==========================================
  The rules are generated by scripts/apply-theme.sh for the active font module
  (scripts/font-picker.sh, $mod+Shift+f): it becomes the default for sans-serif,
  serif and monospace, and replaces common fonts that web pages request by name.
  Pages that ship their own web fonts keep those.
-->
<fontconfig>
  <include ignore_missing="yes">~/.cache/theme/fonts.conf</include>
</fontconfig>
