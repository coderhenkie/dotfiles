# --- Shadows ---
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.50;
shadow-offset-x = -12;
shadow-offset-y = -12;

# Exclude Polybar from shadows
shadow-exclude = [
    "class_g = 'Polybar'"
];

# --- Opacity ---
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;

# Keep Rofi and Polybar at 100% opacity, Kitty & Thunar at 85%, Firefox at 95%
opacity-rule = [
    "100:class_g = 'Rofi'",
    "100:class_g = 'Polybar'",
    "85:class_g = 'kitty'",
    "85:class_g = 'Kitty'",
    "85:class_g = 'Thunar'",
    "85:class_g = 'thunar'",
    "95:class_g = 'firefox-esr'",
    "95:class_g = 'Firefox-esr'",
    "95:class_g = 'firefox'",
    "95:class_g = 'Firefox'",
    "95:class_g = 'Navigator'"
];

# --- Rounded Corners ---
corner-radius = 4;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'"
];

# --- Performance (Fast 2D xrender backend for VM) ---
backend = "xrender";
vsync = true;
