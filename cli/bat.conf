# bat config (BAT_CONFIG_PATH, set in cli/init.bash)
# The "ansi" theme uses the terminal's 16 colors, which Kitty takes from the Color Engine,
# so bat (and the fzf previews and man pages that use it) follows every theme switch.
--theme=ansi
--style=numbers,changes,header
--italic-text=always

# Syntax for the dotfiles' own formats
--map-syntax=*.rasi:CSS
--map-syntax='*.theme:Bourne Again Shell (bash)'
--map-syntax='*.font:Bourne Again Shell (bash)'
--map-syntax='ripgreprc:Bourne Again Shell (bash)'
--map-syntax='bat.conf:Bourne Again Shell (bash)'
