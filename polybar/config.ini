; ==========================================
; Polybar Configuration (Top & Bottom Bars)
; ==========================================

include-file = ~/.cache/theme/polybar.ini
; UI scale (scripts/ui-scale.sh, $mod+Shift+plus/minus): DPI + bar height
include-file = ~/.cache/theme/ui-scale.ini

[bar/base]
; One top + bottom bar per screen (polybar/launch.sh sets MONITOR; empty = primary)
monitor = ${env:MONITOR:}
width = 100%
height = ${ui-scale.height}
dpi = ${ui-scale.dpi}
background = ${colors.background}
foreground = ${colors.foreground}
padding-left = 1
padding-right = 2
module-margin = 1

; Fonts come from the active font module ([fonts] in ~/.cache/theme/polybar.ini, $mod+Shift+f)
font-0 = ${fonts.main}
font-1 = ${fonts.bold}

cursor-click = pointer

separator = "│"
separator-foreground = ${colors.muted}

; ==========================================
; Top Bar: Workspaces, Now Playing, Clock & Tray
; ==========================================
[bar/top]
inherit = bar/base
bottom = false
separator = ""

modules-left = i3
modules-center = media
; The tray can only live on one screen: launch.sh sets TRAY_MODULE=tray on the primary bar
modules-right = date ${env:TRAY_MODULE:}

; ==========================================
; Bottom Bar: System Status (i3bar style)
; ==========================================
[bar/bottom]
inherit = bar/base
bottom = true

modules-left = filesystem network
modules-center = cpu memory gpu
modules-right = pulseaudio bluetooth notifications wifi battery

; ==========================================
; Top Bar Modules
; ==========================================
[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 2
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.urgent}

label-focused = %index%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-padding = 5px
label-focused-margin = 1px

label-unfocused = %index%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 5px
label-unfocused-margin = 1px

label-visible = %index%
label-visible-foreground = ${colors.foreground}
label-visible-background = ${colors.background-alt}
label-visible-padding = 5px
label-visible-margin = 1px

label-urgent = %index%!
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.urgent}
label-urgent-padding = 5px
label-urgent-margin = 1px

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%
label-foreground = ${colors.secondary}

[module/media]
type = custom/script
exec = ~/dotfiles/scripts/polybar-media.sh
tail = true
label = %output%
label-foreground = ${colors.secondary}
click-left = ~/dotfiles/scripts/polybar-media.sh toggle
scroll-up = ~/dotfiles/scripts/polybar-media.sh next
scroll-down = ~/dotfiles/scripts/polybar-media.sh previous

[module/date]
type = internal/date
interval = 5
date = "%d-%m-%Y"
time = "%H:%M"
; Click: toggle the calendar popup (scripts/calendar.sh)
label = %{A1:~/dotfiles/scripts/calendar.sh:} %time%   %date%%{A}
label-foreground = ${colors.primary}

[module/wifi]
; Replaces the nm-applet tray icon. Click: nmtui (connect, edit, VPN) in kitty
type = internal/network
interface-type = wireless
interval = 3
format-connected = %{A1:kitty -e nmtui &:}<ramp-signal> <label-connected>%{A}
format-connected-foreground = ${colors.primary}
label-connected = %essid:0:20:...%
label-connected-foreground = ${colors.foreground}
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
format-disconnected = %{A1:kitty -e nmtui &:}<label-disconnected>%{A}
label-disconnected = 󰤮
label-disconnected-foreground = ${colors.muted}

[module/bluetooth]
; Replaces the blueman tray icon. Left-click: power on/off, right-click: blueman-manager
type = custom/script
interval = 3
exec = ~/dotfiles/scripts/polybar-bluetooth.sh
click-left = ~/dotfiles/scripts/polybar-bluetooth.sh toggle
click-right = blueman-manager &
format-foreground = ${colors.primary}

[module/tray]
type = internal/tray
tray-spacing = 8px

; ==========================================
; Bottom Bar Modules (CPU, RAM, GPU, Disk, Net, Audio, Battery)
; ==========================================
[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = custom/script
interval = 2
exec = ~/dotfiles/scripts/polybar-memory.sh
format-prefix = " RAM "
format-prefix-foreground = ${colors.primary}

[module/gpu]
type = custom/script
interval = 3
format-prefix = "󰢮 GPU "
format-prefix-foreground = ${colors.primary}
exec = ~/dotfiles/scripts/polybar-gpu.sh

[module/filesystem]
type = custom/script
interval = 5
format-prefix = " Disk "
format-prefix-foreground = ${colors.primary}
exec = ~/dotfiles/scripts/polybar-disk.sh

[module/network]
type = custom/script
interval = 3
format-prefix = "󰈀 IP "
format-prefix-foreground = ${colors.primary}
exec = ~/dotfiles/scripts/polybar-ip.sh

[module/notifications]
; Left-click: toggle silent mode, right-click: notification menu (scripts/menu-notifications.sh)
type = custom/script
interval = 1
exec = ~/dotfiles/scripts/menu-notifications.sh status
click-left = ~/dotfiles/scripts/menu-notifications.sh toggle
click-right = ~/dotfiles/scripts/menu-notifications.sh menu

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
; Scroll runs scripts/volume.sh (5% steps snapped to multiples of 5, same as the volume keys);
; these inner action tags take precedence over the module's built-in +/-5% scroll
format-volume-prefix = "%{A4:~/dotfiles/scripts/volume.sh up:}%{A5:~/dotfiles/scripts/volume.sh down:} Vol "
format-volume-prefix-foreground = ${colors.primary}
label-volume = %percentage%%
format-volume-suffix = "%{A}%{A}"
interval = 5
label-muted = " Muted"
label-muted-foreground = ${colors.muted}

[module/battery]
type = custom/script
interval = 10
format-prefix = " Bat "
format-prefix-foreground = ${colors.primary}
exec = bash -c 'bat=$(ls -d /sys/class/power_supply/BAT* 2>/dev/null | head -n 1); if [ -n "$bat" ] && [ -f "$bat/capacity" ]; then cap=$(cat "$bat/capacity"); stat=$(cat "$bat/status" 2>/dev/null); echo "${cap}% (${stat})"; else echo "100% (AC)"; fi'
