include-file = ~/.cache/theme/polybar.ini

[bar/main]
width = 100%
height = 24
background = ${colors.background}
foreground = ${colors.foreground}
padding-right = 2
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=10;2"

modules-left = i3
modules-center = date
modules-right = tray

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
format = <label-state> <label-mode>

label-focused = %index%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-padding = 2

[module/date]
type = internal/date
interval = 5
date = "%d-%m-%Y"
time = "%H:%M"
label =  %time%   %date%
label-foreground = ${colors.primary}

[module/tray]
type = internal/tray
