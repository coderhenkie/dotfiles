# --- Schaduwen ---
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.50;
shadow-offset-x = -12;
shadow-offset-y = -12;

# Zorg dat Polybar geen gekke schaduw krijgt
shadow-exclude = [
    "class_g = 'Polybar'"
];

# --- Transparantie ---
inactive-opacity = 0.85;
active-opacity = 1.0;
frame-opacity = 1.0;

# Rofi en Polybar mogen altijd 100% zichtbaar zijn
opacity-rule = [
    "100:class_g = 'Rofi'",
    "100:class_g = 'Polybar'"
];

# --- Afgeronde hoeken ---
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'"
];

# --- Prestaties (Zorgt voor soepele weergave) ---
backend = "xrender";
vsync = true;
