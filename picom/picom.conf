# --- Shadows ---
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.50;
shadow-offset-x = -12;
shadow-offset-y = -12;

# Exclude Polybar from shadows
shadow-exclude = [
    "class_g = 'Polybar'"
];

# --- Opacity ---
inactive-opacity = 0.97;
active-opacity = 1.0;
frame-opacity = 1.0;

# Keep Rofi and Polybar at 100% opacity, Kitty & Thunar at 87%, Thorium at 97%
opacity-rule = [
    "100:class_g = 'Rofi'",
    "100:class_g = 'Polybar'",
    "87:class_g = 'kitty'",
    "87:class_g = 'Kitty'",
    "87:class_g = 'Thunar'",
    "87:class_g = 'thunar'",
    "97:class_g = 'thorium'",
    "97:class_g = 'Thorium'",
    "97:class_g = 'Thorium-browser'",
    "97:class_g = 'thorium-browser'"
];

# --- Rounded Corners ---
corner-radius = 4;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'"
];

# --- Performance (Fast 2D xrender backend for VM) ---
backend = "xrender";
vsync = true;
