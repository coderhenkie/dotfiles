; ==========================================
; Polybar Configuration (Top & Bottom Bars)
; ==========================================

include-file = ~/.cache/theme/polybar.ini

[bar/base]
width = 100%
height = 27
background = ${colors.background}
foreground = ${colors.foreground}
padding-left = 1
padding-right = 2
module-margin = 1

font-0 = "Iosevka Nerd Font:size=10.5;2"
font-1 = "Iosevka Nerd Font:style=Bold:size=10.5;2"

cursor-click = pointer

separator = "│"
separator-foreground = ${colors.muted}

; ==========================================
; Top Bar: Workspaces, Now Playing, Clock & Tray
; ==========================================
[bar/top]
inherit = bar/base
bottom = false
separator = ""

modules-left = i3
modules-center = media
modules-right = date tray

; ==========================================
; Bottom Bar: System Status (i3bar style)
; ==========================================
[bar/bottom]
inherit = bar/base
bottom = true

modules-left = filesystem network
modules-center = cpu memory gpu
modules-right = notifications pulseaudio battery

; ==========================================
; Top Bar Modules
; ==========================================
[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 2
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.urgent}

label-focused = %index%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-padding = 5px
label-focused-margin = 1px

label-unfocused = %index%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 5px
label-unfocused-margin = 1px

label-visible = %index%
label-visible-foreground = ${colors.foreground}
label-visible-background = ${colors.background-alt}
label-visible-padding = 5px
label-visible-margin = 1px

label-urgent = %index%!
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.urgent}
label-urgent-padding = 5px
label-urgent-margin = 1px

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%
label-foreground = ${colors.secondary}

[module/media]
type = custom/script
exec = ~/dotfiles/scripts/polybar-media.sh
tail = true
label = %output%
label-foreground = ${colors.secondary}
click-left = ~/dotfiles/scripts/polybar-media.sh toggle
scroll-up = ~/dotfiles/scripts/polybar-media.sh next
scroll-down = ~/dotfiles/scripts/polybar-media.sh previous

[module/date]
type = internal/date
interval = 5
date = "%d-%m-%Y"
time = "%H:%M"
; Click: toggle the calendar popup (scripts/calendar.sh)
label = %{A1:~/dotfiles/scripts/calendar.sh:} %time%   %date%%{A}
label-foreground = ${colors.primary}

[module/tray]
type = internal/tray
tray-spacing = 8px

; ==========================================
; Bottom Bar Modules (CPU, RAM, GPU, Disk, Net, Audio, Battery)
; ==========================================
[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used%% (%gb_used%)

[module/gpu]
type = custom/script
interval = 3
format-prefix = "󰢮 GPU "
format-prefix-foreground = ${colors.primary}
exec = ~/dotfiles/scripts/polybar-gpu.sh

[module/filesystem]
type = custom/script
interval = 5
format-prefix = " Disk "
format-prefix-foreground = ${colors.primary}
exec = ~/dotfiles/scripts/polybar-disk.sh

[module/network]
type = custom/script
interval = 3
format-prefix = "󰈀 IP "
format-prefix-foreground = ${colors.primary}
exec = ~/dotfiles/scripts/polybar-ip.sh

[module/notifications]
; Left-click: toggle silent mode, right-click: notification menu (scripts/notifications.sh)
type = custom/script
interval = 1
exec = ~/dotfiles/scripts/notifications.sh status
click-left = ~/dotfiles/scripts/notifications.sh toggle
click-right = ~/dotfiles/scripts/notifications.sh menu

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
format-volume-prefix = " Vol "
format-volume-prefix-foreground = ${colors.primary}
label-volume = %percentage%%
label-muted = " Muted"
label-muted-foreground = ${colors.muted}

[module/battery]
type = custom/script
interval = 10
format-prefix = " Bat "
format-prefix-foreground = ${colors.primary}
exec = bash -c 'bat=$(ls -d /sys/class/power_supply/BAT* 2>/dev/null | head -n 1); if [ -n "$bat" ] && [ -f "$bat/capacity" ]; then cap=$(cat "$bat/capacity"); stat=$(cat "$bat/status" 2>/dev/null); echo "${cap}% (${stat})"; else echo "100% (AC)"; fi'
